# Build-time Maven proxy. The build container sits on an internal Docker
# network where this proxy is the only reachable host; only the proxy has
# internet access. It serves public artifacts read-only and logs every
# request to stdout for the trusted post-build inventory step.
#
# Routing mirrors the SDK's repository order (Google, Central, Gradle Plugin
# Portal), falling through on 404. JitPack is reachable only for
# com.github.lightphone: anyone can publish there, so it must never act as a
# fallback.

worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    client_body_temp_path /tmp/nginx/client;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    # Written by maven-proxy.sh from the container's resolv.conf. All upstream
    # names resolve at request time, so transient DNS failure cannot kill nginx.
    include /tmp/nginx/resolver.conf;

    log_format maven '$time_iso8601 $request_method $request_uri $status '
                     '$body_bytes_sent "$upstream_addr" "$upstream_status"';
    access_log /dev/stdout maven;

    # nginx does not verify upstream certificates by default.
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 4;
    proxy_ssl_server_name on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_intercept_errors on;
    recursive_error_pages on;

    map $upstream_http_location $portal_redirect_allowed {
        ~^https://(plugins-artifacts\.gradle\.org|repo\.maven\.apache\.org|repo1\.maven\.org)/ 1;
        default 0;
    }

    map $request_method $jitpack_host { default jitpack.io; }
    map $request_method $google_host { default dl.google.com; }
    map $request_method $central_host { default repo.maven.apache.org; }
    map $request_method $portal_host { default plugins.gradle.org; }

    server {
        listen 8080;

        location = /healthz {
            access_log off;
            return 200;
        }

        location /com/github/lightphone/ {
            limit_except GET HEAD { deny all; }
            proxy_pass https://$jitpack_host;
        }

        location / {
            limit_except GET HEAD { deny all; }
            # Upstream paths below are built from the raw request URI.
            if ($is_args) {
                return 400;
            }
            proxy_pass https://$google_host/dl/android/maven2$request_uri;
            error_page 404 = @central;
        }

        location @central {
            rewrite ^ /maven2$request_uri break;
            proxy_pass https://$central_host;
            error_page 404 = @portal;
        }

        location @portal {
            rewrite ^ /m2$request_uri break;
            proxy_pass https://$portal_host;
            error_page 301 302 303 307 308 = @portal_redirect;
        }

        location @portal_redirect {
            if ($portal_redirect_allowed = 0) {
                return 502;
            }
            set $target $upstream_http_location;
            proxy_pass $target;
        }
    }
}
