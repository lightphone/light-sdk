version: 2.1

parameters:
  push-dev-image:
    type: boolean
    default: false

commands:
  resolve-sdk-version:
    steps:
      - run:
          name: resolve sdk version
          command: |
            set -euo pipefail
            SDK_VERSION="$(
              awk -F= '/^[[:space:]]*sdkVersion[[:space:]]*=/ {
                value = $2
                gsub(/^[[:space:]]+|[[:space:]\r]+$/, "", value)
                print value
                exit
              }' gradle.properties
            )"
            if [[ ! "$SDK_VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "sdkVersion '$SDK_VERSION' is missing or not a valid Docker tag" >&2
              exit 1
            fi
            echo "SDK_VERSION=$SDK_VERSION"
            echo "export SDK_VERSION='$SDK_VERSION'" >> "$BASH_ENV"

  unit-tests:
    steps:
      - run:
          name: builder unit tests
          command: |
            set -euo pipefail
            python3 -m venv /tmp/venv
            /tmp/venv/bin/pip install -q pytest
            cd builder && /tmp/venv/bin/python -m pytest -q
      - run:
          name: plugin unit tests
          command: |
            set -euo pipefail
            docker run --rm -v "$PWD:/src" -w /src/plugin eclipse-temurin:17-jdk-noble \
              ../gradlew test --no-daemon
      - run:
          name: shellcheck
          command: |
            set -euo pipefail
            docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.10.0 \
              builder/bin/with-proxy.sh

  # Builds the runtime image into the local Docker image store. No credentials
  # are passed into the build.
  build-image:
    parameters:
      tag:
        type: string
    steps:
      - run:
          name: build light-builder image
          no_output_timeout: 60m
          command: |
            set -euo pipefail
            DOCKER_BUILDKIT=1 docker build \
              -f builder/Dockerfile \
              --platform=linux/amd64 \
              --add-host maven-proxy=127.0.0.1 \
              --build-arg "SDK_GIT_URL=https://github.com/lightphone/light-sdk" \
              --build-arg "SDK_GIT_REF=${CIRCLE_SHA1}" \
              --target runtime \
              -t "<< parameters.tag >>" \
              builder/

  test-image:
    parameters:
      image:
        type: string
    steps:
      - run:
          name: proxy starts without network access
          command: |
            set -euo pipefail
            bash builder/tests/check_proxy_startup.sh "<< parameters.image >>"
      - run:
          name: build sample tool and fixtures behind the Maven proxy
          no_output_timeout: 60m
          command: |
            set -euo pipefail
            builder/tests/integration.sh "<< parameters.image >>" /tmp/light-builder-integration
      - store_artifacts:
          path: /tmp/light-builder-integration
          destination: integration

  # Exports the Maven bundle from the same build as the image: every step the
  # two share must come from cache. Needs SDK_VERSION (resolve-sdk-version).
  build-bundle:
    steps:
      - run:
          name: build Maven bundle
          no_output_timeout: 60m
          command: |
            set -euo pipefail
            mkdir -p /tmp/bundle
            DOCKER_BUILDKIT=1 docker build \
              -f builder/Dockerfile \
              --platform=linux/amd64 \
              --add-host maven-proxy=127.0.0.1 \
              --build-arg "SDK_GIT_URL=https://github.com/lightphone/light-sdk" \
              --build-arg "SDK_GIT_REF=${CIRCLE_SHA1}" \
              --target maven-bundle-out \
              --output type=local,dest=/tmp/maven-release \
              --progress=plain \
              builder/ 2>&1 | tee /tmp/bundle/bundle-build.log
            python3 builder/tests/check_cached.py /tmp/bundle/bundle-build.log \
              base sdk proxy-base gradle-warmup
      - run:
          name: package Maven bundle
          command: |
            set -euo pipefail
            BUNDLE="light-sdk-maven-${SDK_VERSION}.zip"
            (cd /tmp/maven-release && python3 -m zipfile -c "/tmp/bundle/$BUNDLE" com)
            (cd /tmp/bundle && sha256sum "$BUNDLE" > "$BUNDLE.sha256" && cat "$BUNDLE.sha256")
      - store_artifacts:
          path: /tmp/bundle
          destination: bundle

jobs:
  build-and-push-light-builder:
    machine:
      image: ubuntu-2204:current
    resource_class: xlarge
    steps:
      - checkout

      - run:
          name: resolve sdk version
          command: |
            set -euo pipefail

            SDK_VERSION="$(
              awk -F= '/^[[:space:]]*sdkVersion[[:space:]]*=/ {
                value = $2
                gsub(/^[[:space:]]+|[[:space:]\r]+$/, "", value)
                print value
                exit
              }' gradle.properties
            )"

            if [[ -z "$SDK_VERSION" ]]; then
              echo "sdkVersion is missing from gradle.properties" >&2
              exit 1
            fi
            if [[ ! "$SDK_VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "sdkVersion '$SDK_VERSION' is not a valid Docker tag" >&2
              exit 1
            fi

            if [[ -z "${CIRCLE_TAG:-}" ]]; then
              echo "this job only runs on git tags" >&2
              exit 1
            fi
            if [[ "$CIRCLE_TAG" != "$SDK_VERSION" && "$CIRCLE_TAG" != "v$SDK_VERSION" ]]; then
              echo "tag '$CIRCLE_TAG' does not match sdkVersion '$SDK_VERSION' (or v$SDK_VERSION)" >&2
              exit 1
            fi

            echo "SDK_GIT_URL=https://github.com/lightphone/light-sdk"
            echo "SDK_GIT_REF=$CIRCLE_SHA1"
            echo "CIRCLE_TAG=$CIRCLE_TAG"
            echo "SDK_VERSION=$SDK_VERSION"
            echo "export SDK_VERSION='$SDK_VERSION'" >> "$BASH_ENV"

      - run:
          name: install docker buildx
          command: |
            set -euo pipefail
            if ! docker buildx version >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker-buildx-plugin || true
            fi
            docker buildx version
            docker buildx create --use --name light-builder-builder || docker buildx use light-builder-builder

      - run:
          name: build light-builder image
          no_output_timeout: 60m
          command: |
            set -euo pipefail
            : "${GH_PACKAGES_USER:?GH_PACKAGES_USER must be set}"
            : "${GH_PACKAGES_TOKEN:?GH_PACKAGES_TOKEN must be set}"

            export DOCKER_BUILDKIT=1
            docker build \
              -f builder/Dockerfile \
              --platform=linux/amd64 \
              --add-host maven-proxy=127.0.0.1 \
              --build-arg "SDK_GIT_URL=https://github.com/lightphone/light-sdk" \
              --build-arg "SDK_GIT_REF=${CIRCLE_SHA1}" \
              --secret id=github_token,env=GH_PACKAGES_TOKEN \
              --secret id=gh_packages_user,env=GH_PACKAGES_USER \
              -t "thelightphone/light-sdk-builder:${SDK_VERSION}" \
              builder/

      - run:
          name: docker hub login
          command: |
            set -euo pipefail
            echo "$LIGHT_DOCKER_HUB_PASSWORD" | \
              docker login -u "$LIGHT_DOCKER_HUB_USERNAME" --password-stdin

      - run:
          name: push image tags
          command: |
            set -euo pipefail
            docker push "thelightphone/light-sdk-builder:${SDK_VERSION}"
            echo "pushed thelightphone/light-sdk-builder:${SDK_VERSION}"

            docker tag \
              "thelightphone/light-sdk-builder:${SDK_VERSION}" \
              "thelightphone/light-sdk-builder:latest"
            docker push "thelightphone/light-sdk-builder:latest"
            echo "pushed thelightphone/light-sdk-builder:latest"

            docker image inspect \
              "thelightphone/light-sdk-builder:${SDK_VERSION}" \
              --format '{{index .RepoDigests 0}}'

  verify-light-builder:
    machine:
      image: ubuntu-2204:current
    resource_class: xlarge
    steps:
      - checkout
      - resolve-sdk-version
      - unit-tests
      - build-image:
          tag: light-sdk-builder:candidate
      - test-image:
          image: light-sdk-builder:candidate
      - build-bundle

      # Test images for light-tool-ci-builder's pipeline. dev-* tags never move
      # a version tag; tool builds pull them only when LIGHT_BUILDER_SDK_GIT_REF
      # is set. Login happens after every tool build has finished.
      - run:
          name: push dev image
          command: |
            set -euo pipefail
            DEV_TAG="thelightphone/light-sdk-builder:dev-${CIRCLE_SHA1:0:12}"
            echo "$LIGHT_DOCKER_HUB_PASSWORD" | \
              docker login -u "$LIGHT_DOCKER_HUB_USERNAME" --password-stdin
            docker tag light-sdk-builder:candidate "$DEV_TAG"
            docker push "$DEV_TAG"
            docker logout
            {
              echo "image=$(docker image inspect "$DEV_TAG" --format '{{index .RepoDigests 0}}')"
              echo "sdkCommit=${CIRCLE_SHA1}"
            } | tee /tmp/dev-image.txt

      - store_artifacts:
          path: /tmp/dev-image.txt
          destination: dev-image.txt

workflows:
  # Manual: trigger a pipeline on the wanted branch with push-dev-image=true.
  verify-light-builder:
    when: << pipeline.parameters.push-dev-image >>
    jobs:
      - verify-light-builder

  build-light-builder:
    jobs:
      - build-and-push-light-builder:
          filters:
            tags:
              only: /^v?\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
